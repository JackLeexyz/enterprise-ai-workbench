services:
  setup:
    image: bolai-workbench:0.11.1
    build: .
    profiles: [setup]
    command: [python, setup_app.py, --database, /data/workbench.db, --credentials-out, /private/login.json]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - workbench-data:/data
      - workbench-private:/private
  workbench:
    image: bolai-workbench:0.11.1
    build: .
    restart: unless-stopped
    environment:
      WORKBENCH_ORIGIN: ${WORKBENCH_ORIGIN:-http://127.0.0.1:4180}
      WORKBENCH_DEMO_LOGIN: ${WORKBENCH_DEMO_LOGIN:-0}
    ports:
      - 127.0.0.1:4180:4180
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 64
    volumes:
      - workbench-data:/data
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request, urllib.parse; origin=os.getenv('WORKBENCH_ORIGIN','http://127.0.0.1:4180'); request=urllib.request.Request('http://127.0.0.1:4180/api/workbench/health',headers={'Host':urllib.parse.urlsplit(origin).netloc}); urllib.request.urlopen(request,timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  workbench-data:
  workbench-private:
